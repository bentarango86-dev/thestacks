<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connecting to Spotify…</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #faf3e8;
      color: #1a1a2e;
    }
  </style>
</head>
<body>
  <p id="status">Connecting to Spotify…</p>

  <script src="spotify-integration.js"></script>
  <script>
    SpotifyExport.handleRedirect().then(({ success, resumeGenre }) => {
      const status = document.getElementById("status");
      if (success) {
        status.textContent = "Connected! Redirecting…";
        const target = resumeGenre ? `index.html?genre=${encodeURIComponent(resumeGenre)}` : "index.html";
        // Small flag so index.html knows to auto-resume the export on load
        sessionStorage.setItem("stacks_spotify_just_connected", "1");
        window.location.href = target;
      } else {
        status.textContent = "Something went wrong connecting to Spotify. Please try again.";
      }
    });
  </script>
</body>
</html>
