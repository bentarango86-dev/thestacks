<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Stacks — Stacks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Stacks">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>
  /* Hover-reveal play button on each shelf label */
  .shelf-label { position: relative; }
  .shelf-play-btn {
    opacity: 0.28;
    transition: opacity 0.18s ease, transform 0.18s ease;
    background: var(--ink, #0c2340);
    color: #fff;
    border: none;
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
    font-size: 15px;
  }
  .shelf-label:hover .shelf-play-btn,
  .shelf-play-btn:focus-visible {
    opacity: 1;
    transform: scale(1.05);
  }
  @media (hover: none) {
    .shelf-play-btn { opacity: 0.55; }
  }
  .shelf-play-btn:disabled { opacity: 1; cursor: default; }

  /* Playlist-building overlay */
  .spotify-overlay-backdrop {
    position: fixed; inset: 0;
    background: rgba(12,35,64,0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .spotify-overlay-card {
    background: #faf3e8;
    border-radius: 14px;
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .spotify-overlay-close {
    position: absolute; top: 8px; right: 10px;
    background: none; border: none; font-size: 20px;
    color: var(--ink); cursor: pointer; line-height: 1;
    padding: 6px;
  }
  .spotify-overlay-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: rgba(12,35,64,0.55);
    margin: 0 0 6px;
  }
  .spotify-overlay-genre {
    font-family: 'Fraunces', serif;
    font-weight: 700; font-size: 24px;
    color: var(--ink); margin: 0 0 6px;
  }
  .spotify-overlay-meta {
    font-size: 13px; color: rgba(12,35,64,0.6);
    margin: 0 0 20px;
  }
  .spotify-progress-track {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
  }
  .spotify-progress-block {
    width: 16px; height: 8px; border-radius: 2px;
    background: rgba(12,35,64,0.12);
    transition: background 0.25s ease;
  }
  .spotify-progress-block.filled { background: #1DB954; }
  .spotify-overlay-current {
    font-size: 12px; color: rgba(12,35,64,0.55);
    margin: 14px 0 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .spotify-overlay-check {
    width: 48px; height: 48px; border-radius: 50%;
    background: #1DB954; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin: 0 auto 14px;
    animation: spotifyCheckPop 0.3s ease;
  }
  @keyframes spotifyCheckPop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .spotify-overlay-status {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px;
    color: var(--ink); margin: 0 0 16px;
  }
  .spotify-overlay-fallback-link {
    display: inline-block; font-size: 13px;
    color: rgba(12,35,64,0.6); text-decoration: underline;
  }
  .spotify-overlay-error-detail {
    font-size: 13px; color: rgba(12,35,64,0.6); margin: 0 0 16px;
  }
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://fastly.jsdelivr.net/npm/barcode-detector@3.2.0/dist/iife/polyfill.min.js"></script>
<body>
<div class="wrap">

  <header>
    <img src="logo.png" alt="The Stacks" class="logo-mark">
    <div class="titles">
      <h1>The Stacks</h1>
      <p>your personal record ledger</p>
    </div>
    <div class="header-actions">
      <div class="profile-menu-wrap" id="profileMenuWrap">
        <button type="button" class="profile-card-btn" id="profileMenuBtn" aria-haspopup="true" aria-expanded="false">
          <span class="profile-avatar" id="profileAvatar"></span>
          <span id="profileName"></span>
          <i class="ti ti-chevron-down profile-caret"></i>
        </button>
        <div class="profile-menu" id="profileMenu" hidden>
          <button type="button" class="detail-menu-item" id="helpBtn"><i class="ti ti-help-circle"></i>Help</button>
          <button type="button" class="detail-menu-item" id="securityBtn"><i class="ti ti-shield-lock"></i>Security</button>
          <button type="button" class="detail-menu-item" id="exportBtn"><i class="ti ti-download"></i>Export CSV</button>
          <div class="profile-menu-divider"></div>
          <button type="button" class="detail-menu-item" id="signOutBtn"><i class="ti ti-logout"></i>Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div id="appBody" style="display:none;">

  <div class="view-tabs">
    <a href="index.html" class="tab-btn active"><i class="ti ti-stack-2" style="font-size:15px; vertical-align:-2px; margin-right:4px;"></i>Stacks</a>
    <a href="records.html" class="tab-btn"><i class="ti ti-list" style="font-size:15px; vertical-align:-2px; margin-right:4px;"></i>All Records</a>
  </div>

  <div class="home-search-row" id="homeSearchRow">
    <div class="home-search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="homeSearch" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="search-clear-btn" id="homeSearchClear" title="Clear search"><i class="ti ti-x"></i></button>
    </div>
    <div class="quick-row" id="homeQuickRow">
      <button type="button" class="chip-btn" id="randomBtn"><i class="ti ti-dice-5"></i>Random Record</button>
      <a href="#" class="chip-btn" id="continueBtn" style="display:none;"><i class="ti ti-history"></i><span id="continueLabel"></span></a>
      <div class="quick-row-right">
        <div class="sort-menu-wrap" id="sortMenuWrap">
          <button type="button" class="icon-btn" id="sortMenuBtn" title="Sort stacks" aria-haspopup="true" aria-expanded="false"><i class="ti ti-arrows-sort"></i></button>
          <div class="sort-menu" id="sortMenu" hidden>
            <button type="button" class="sort-menu-item" data-sort="genre-asc">Genre A–Z</button>
            <button type="button" class="sort-menu-item" data-sort="count-desc">Most records</button>
            <button type="button" class="sort-menu-item" data-sort="count-asc">Fewest records</button>
          </div>
        </div>
        <button class="btn btn-primary" id="addBtn">+ Add Record</button>
      </div>
    </div>
  </div>

  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <span>Loading your collection…</span>
  </div>

  <div id="searchResultsSection" style="display:none;">
    <h2 class="section-heading" id="searchResultsHeading"></h2>
    <div class="gallery-grid" id="searchResultsGrid"></div>
  </div>

  <div class="new-arrivals-panel" id="recentlyAddedShelf">
    <div class="new-arrivals-sign">
      <span class="new-arrivals-tag">New Arrivals</span>
      <span class="new-arrivals-subtitle">Fresh off the shelf</span>
    </div>
    <div class="shelf-body">
      <button type="button" class="shelf-arrow prev" aria-label="Scroll left" hidden onclick="scrollShelf(this, -1)"><i class="ti ti-chevron-left"></i></button>
      <div class="shelf-row" id="recentlyAddedRow"></div>
      <button type="button" class="shelf-arrow next" aria-label="Scroll right" hidden onclick="scrollShelf(this, 1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="shelf-ledge"></div>
  </div>

  <div id="shelvesContainer"></div>

  <div class="shelf" id="wishlistShelf" style="display:none;">
    <div class="shelf-label">
      <h3>Wishlist</h3>
      <span class="shelf-count" id="wishlistCount"></span>
    </div>
    <div class="shelf-body">
      <button type="button" class="shelf-arrow prev" aria-label="Scroll left" hidden onclick="scrollShelf(this, -1)"><i class="ti ti-chevron-left"></i></button>
      <div class="shelf-row" id="wishlistRow"></div>
      <button type="button" class="shelf-arrow next" aria-label="Scroll right" hidden onclick="scrollShelf(this, 1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="shelf-ledge"></div>
  </div>
  </div>
</div>

<div id="modals-root"></div>

<script src="modals.js"></script>
<script src="app.js"></script>
<script src="spotify-integration.js"></script>
<script>
// ---- STACKS PAGE ----
// (iconForGenre, buildShelfRow/buildShelfCover, openDetailModal live in app.js — shared with records.html)
// Everything renders in place now — no drill page, no navigation away from
// this screen just to look inside a genre.

function saveLastGenre(genre) {
  if (genre === 'recentlyAdded') return; // not a real shelf — nothing to "continue browsing" to
  try { localStorage.setItem('stacks:lastGenre', genre); } catch (e) { /* non-fatal */ }
}
function loadLastGenre() {
  try { return localStorage.getItem('stacks:lastGenre'); } catch (e) { return null; }
}

// ---- Sort persistence (survives reloads) ----
function loadSavedSort(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}
function saveSort(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private browsing etc — non-fatal */ }
}

// ---- Stack sort: small icon-triggered menu instead of a standalone
// dropdown bar, so it reads as a minor view option, not a primary control. ----
let stackSort = loadSavedSort('stacks:stackSort', 'genre-asc');

function openSortMenu() {
  el('sortMenu').hidden = false;
  el('sortMenuBtn').setAttribute('aria-expanded', 'true');
}
function closeSortMenu() {
  el('sortMenu').hidden = true;
  el('sortMenuBtn').setAttribute('aria-expanded', 'false');
}
function setStackSort(value) {
  stackSort = value;
  saveSort('stacks:stackSort', value);
  document.querySelectorAll('.sort-menu-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sort === value);
  });
  closeSortMenu();
  renderShelves();
}
el('sortMenuBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (el('sortMenu').hidden) openSortMenu(); else closeSortMenu();
});
document.addEventListener('click', e => {
  if (!el('sortMenu').hidden && !el('sortMenu').contains(e.target) && e.target !== el('sortMenuBtn')) {
    closeSortMenu();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !el('sortMenu').hidden) closeSortMenu();
});
document.querySelectorAll('.sort-menu-item').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.sort === stackSort);
  btn.addEventListener('click', () => setStackSort(btn.dataset.sort));
});

function renderShelves() {
  const container = el('shelvesContainer');
  const owned = records.filter(r => !r.isWishlist);
  if (owned.length === 0) {
    container.innerHTML = `
      <button type="button" class="empty-state-cta" onclick="openModal(null)">
        <i class="ti ti-plus"></i>
        The crate is empty — add your first record
      </button>`;
    return;
  }

  const groups = {};
  owned.forEach(r => {
    const key = r.genre || '__none__';
    (groups[key] = groups[key] || []).push(r);
  });

  const entries = Object.entries(groups).sort((a, b) => {
    if (a[0] === '__none__') return 1;
    if (b[0] === '__none__') return -1;
    switch (stackSort) {
      case 'count-desc': return b[1].length - a[1].length;
      case 'count-asc': return a[1].length - b[1].length;
      default: return a[0].localeCompare(b[0]);
    }
  });

  container.innerHTML = entries.map(([genre, list]) => {
    const label = genre === '__none__' ? 'No genre' : genre;
    return `
      <section class="shelf">
        <div class="shelf-label" id="shelfLabel-${escapeAttr(genre)}">
          <h3>${escapeHtml(label)}</h3>
          <span class="shelf-count">${list.length} record${list.length === 1 ? '' : 's'}</span>
          <button type="button" class="shelf-play-btn" title="Play this stack on Spotify" onclick='runSpotifyExport(this, ${JSON.stringify(genre)})'><i class="ti ti-player-play-filled"></i></button>
        </div>
        <div class="shelf-body">
          <button type="button" class="shelf-arrow prev" aria-label="Scroll left" hidden onclick="scrollShelf(this, -1)"><i class="ti ti-chevron-left"></i></button>
          <div class="shelf-row" id="shelfRow-${escapeAttr(genre)}"></div>
          <button type="button" class="shelf-arrow next" aria-label="Scroll right" hidden onclick="scrollShelf(this, 1)"><i class="ti ti-chevron-right"></i></button>
        </div>
        <div class="shelf-ledge"></div>
      </section>
    `;
  }).join('');

  // Newest records toward the front of each shelf — flipping through feels
  // like the crate itself, not an alphabetized catalog.
  entries.forEach(([genre, list]) => {
    const sorted = [...list].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
    buildShelfRow(document.getElementById('shelfRow-' + genre), sorted, genre);
  });

  // If we're returning from a Spotify login redirect mid-export, resume now
  // that the shelf (and its button) actually exists in the DOM.
  if (pendingSpotifyResumeGenre) {
    const genre = pendingSpotifyResumeGenre;
    pendingSpotifyResumeGenre = null;
    const labelEl = el('shelfLabel-' + genre);
    const btn = labelEl ? labelEl.querySelector('.shelf-play-btn') : null;
    runSpotifyExport(btn, genre);
  }
}

function renderRecentlyAdded() {
  const recent = records.filter(r => !r.isWishlist).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 10);
  if (recent.length === 0) {
    el('recentlyAddedShelf').style.display = 'none';
    return;
  }
  el('recentlyAddedShelf').style.display = 'block';
  buildShelfRow(el('recentlyAddedRow'), recent, 'recentlyAdded', { featured: true });
}

// ---- WISHLIST SHELF (flat row, not grouped by genre) ----
function renderWishlistShelf() {
  const wishlist = records.filter(r => r.isWishlist).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  if (wishlist.length === 0) {
    el('wishlistShelf').style.display = 'none';
    return;
  }
  el('wishlistShelf').style.display = 'block';
  el('wishlistCount').textContent = `${wishlist.length} record${wishlist.length === 1 ? '' : 's'}`;
  buildShelfRow(el('wishlistRow'), wishlist, 'wishlist', { wishlist: true });
}

// ---- SEARCH (primary navigation on the homepage) ----
function renderSearchResults() {
  const q = el('homeSearch').value.trim().toLowerCase();
  const owned = records.filter(r => !r.isWishlist);
  if (!q) {
    el('searchResultsSection').style.display = 'none';
    el('recentlyAddedShelf').style.display = owned.length ? 'block' : 'none';
    el('shelvesContainer').style.display = 'block';
    return true; // no query — caller should render the normal homepage
  }
  const matches = owned.filter(r => recordMatchesQuery(r, q));
  el('recentlyAddedShelf').style.display = 'none';
  el('shelvesContainer').style.display = 'none';
  el('wishlistShelf').style.display = 'none';
  el('searchResultsSection').style.display = 'block';
  el('searchResultsHeading').innerHTML = `
    ${matches.length} result${matches.length === 1 ? '' : 's'}
    <a href="records.html?q=${encodeURIComponent(el('homeSearch').value.trim())}" class="section-heading-link">Refine with filters in All Records <i class="ti ti-arrow-right"></i></a>
  `;
  renderGalleryGrid(el('searchResultsGrid'), matches);
  return false;
}
el('homeSearch').addEventListener('input', debounce(() => { renderSearchResults(); }, 150));
wireSearchClear('homeSearch', 'homeSearchClear', renderSearchResults);

el('randomBtn').addEventListener('click', openRandomRecord);

el('continueBtn').addEventListener('click', e => {
  e.preventDefault();
  const genre = el('continueBtn').dataset.genre;
  const label = el('shelfLabel-' + genre);
  if (!label) return;
  label.scrollIntoView({ behavior: 'smooth', block: 'center' });
  label.classList.remove('flash');
  void label.offsetWidth; // restart the animation if it's already been triggered once
  label.classList.add('flash');
});

// ---- Spotify export ----
// Genre to resume exporting once shelves re-render after an OAuth redirect
// (read once at load, consumed by renderShelves() the next time it runs).
let pendingSpotifyResumeGenre = new URLSearchParams(window.location.search).get('spotifyResumeGenre');
if (pendingSpotifyResumeGenre) {
  const url = new URL(window.location.href);
  url.searchParams.delete('spotifyResumeGenre');
  window.history.replaceState({}, '', url); // keep refreshes from re-triggering
}

// ---- Spotify export overlay ----
function ensureSpotifyOverlay() {
  let backdrop = document.getElementById('spotifyOverlayBackdrop');
  if (backdrop) return backdrop;
  backdrop = document.createElement('div');
  backdrop.className = 'spotify-overlay-backdrop';
  backdrop.id = 'spotifyOverlayBackdrop';
  backdrop.innerHTML = `
    <div class="spotify-overlay-card">
      <button type="button" class="spotify-overlay-close" id="spotifyOverlayClose" aria-label="Close">&times;</button>
      <div id="spotifyOverlayBody"></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeSpotifyOverlay(); });
  document.getElementById('spotifyOverlayClose').addEventListener('click', closeSpotifyOverlay);
  return backdrop;
}

function openSpotifyOverlay() {
  ensureSpotifyOverlay().style.display = 'flex';
}

function closeSpotifyOverlay() {
  const backdrop = document.getElementById('spotifyOverlayBackdrop');
  if (backdrop) backdrop.style.display = 'none';
}

function renderSpotifyBuildingState(label, albumCount, trackTotal, filledSegments, totalSegments, currentAlbum, tracksAddedSoFar) {
  const blocks = Array.from({ length: totalSegments }, (_, i) =>
    `<div class="spotify-progress-block${i < filledSegments ? ' filled' : ''}"></div>`
  ).join('');
  document.getElementById('spotifyOverlayBody').innerHTML = `
    <p class="spotify-overlay-eyebrow">Building playlist…</p>
    <h3 class="spotify-overlay-genre">${escapeHtml(label)}</h3>
    <p class="spotify-overlay-meta">${albumCount} album${albumCount === 1 ? '' : 's'} · ${trackTotal} track${trackTotal === 1 ? '' : 's'}</p>
    <div class="spotify-progress-track">${blocks}</div>
    ${currentAlbum ? `<p class="spotify-overlay-current">${escapeHtml(currentAlbum)} · ${tracksAddedSoFar} added so far</p>` : ''}
  `;
}

function renderSpotifySuccessState(playlistUrl, tracksAdded, unmatchedCount) {
  const countLine = unmatchedCount > 0
    ? `${tracksAdded} track${tracksAdded === 1 ? '' : 's'} added · ${unmatchedCount} couldn't be matched`
    : `${tracksAdded} track${tracksAdded === 1 ? '' : 's'} added`;
  document.getElementById('spotifyOverlayBody').innerHTML = `
    <div class="spotify-overlay-check"><i class="ti ti-check"></i></div>
    <p class="spotify-overlay-status">Opening Spotify…</p>
    <p class="spotify-overlay-meta">${escapeHtml(countLine)}</p>
    <a href="${playlistUrl}" target="_blank" class="spotify-overlay-fallback-link">Didn't open? Tap here</a>
  `;
}

function renderSpotifyErrorState(message) {
  document.getElementById('spotifyOverlayBody').innerHTML = `
    <p class="spotify-overlay-status">Couldn't build the playlist</p>
    <p class="spotify-overlay-error-detail">${escapeHtml(message)}</p>
    <button type="button" class="btn btn-ghost" onclick="closeSpotifyOverlay()">Close</button>
  `;
}

async function runSpotifyExport(btn, genre) {
  if (!SpotifyExport.isLoggedIn()) {
    SpotifyExport.redirectToAuth(genre); // leaves the page, comes back via spotify-callback.html
    return;
  }

  const label = genre === '__none__' ? 'No genre' : genre;
  const list = records.filter(r => !r.isWishlist && (genre === '__none__' ? !r.genre : r.genre === genre));
  const trackTotal = list.reduce((sum, r) => sum + SpotifyExport.parseTracklist(r.tracklist).length, 0);
  const totalSegments = Math.min(list.length, 24) || 1;

  if (btn) btn.disabled = true;
  openSpotifyOverlay();
  renderSpotifyBuildingState(label, list.length, trackTotal, 0, totalSegments);

  try {
    const result = await SpotifyExport.buildPlaylist({
      stackName: `${label} Stack`,
      records: list,
      onProgress: ({ albumsDone, albumsTotal, tracksAdded, currentAlbum }) => {
        const filled = Math.round((albumsDone / albumsTotal) * totalSegments);
        renderSpotifyBuildingState(label, list.length, trackTotal, filled, totalSegments, currentAlbum, tracksAdded);
      },
    });

    if (result.unmatched.length > 0) {
      console.warn('Tracks Spotify could not match:', result.unmatched);
    }

    renderSpotifySuccessState(result.playlistUrl, result.tracksAdded, result.unmatched.length);

    // Best-effort auto-open. On iOS this may just open the web player instead
    // of the native app (or do nothing at all) since we're a couple of
    // `await`s past the original tap — the fallback link above covers that,
    // and the overlay closing on its own leaves no dead-end state either way.
    setTimeout(() => {
      window.location.href = result.playlistUrl;
    }, 550);
    setTimeout(() => {
      closeSpotifyOverlay();
      if (btn) btn.disabled = false;
    }, 4000);
  } catch (err) {
    console.error(err);
    renderSpotifyErrorState(err.message || 'Please try again.');
    if (btn) btn.disabled = false;
  }
}


function renderPage() {
  renderStats();
  const ownedCount = records.filter(r => !r.isWishlist).length;
  el('homeSearch').placeholder = `Search within your ${ownedCount} record${ownedCount === 1 ? '' : 's'}`;

  const lastGenre = loadLastGenre();
  const lastGenreStillExists = lastGenre && records.some(r => (r.genre || '') === lastGenre || (lastGenre === '__none__' && !r.genre));
  if (lastGenreStillExists) {
    el('continueLabel').textContent = `Continue browsing ${lastGenre === '__none__' ? 'No genre' : lastGenre}`;
    el('continueBtn').dataset.genre = lastGenre;
    el('continueBtn').style.display = 'inline-flex';
  } else {
    el('continueBtn').style.display = 'none';
  }

  if (renderSearchResults()) {
    renderRecentlyAdded();
    renderShelves();
    renderWishlistShelf();
  }
}
</script>
</body>
</html>
